<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <rect width="920" height="300" fill="#0b0d12"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4f8cff"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#21d07a"/>
    </marker>
  </defs>

  <text x="28" y="40" fill="#e8ecf4" font-size="17" font-weight="600">Paste a magnet, watch it, keep only what you watched</text>

  <!-- magnet -->
  <rect x="28" y="70" width="150" height="62" rx="10" fill="#171b24" stroke="#232937"/>
  <text x="103" y="97" fill="#e8ecf4" font-size="13" font-weight="600" text-anchor="middle">magnet:?xt=…</text>
  <text x="103" y="116" fill="#8b93a7" font-size="11" text-anchor="middle">metadata only (~KB)</text>

  <!-- probe -->
  <rect x="216" y="70" width="160" height="62" rx="10" fill="#171b24" stroke="#232937"/>
  <text x="296" y="97" fill="#e8ecf4" font-size="13" font-weight="600" text-anchor="middle">ffprobe first MBs</text>
  <text x="296" y="116" fill="#8b93a7" font-size="11" text-anchor="middle">real codecs, not extension</text>

  <!-- plan -->
  <rect x="414" y="70" width="180" height="62" rx="10" fill="#171b24" stroke="#232937"/>
  <text x="504" y="97" fill="#e8ecf4" font-size="13" font-weight="600" text-anchor="middle">choose transport</text>
  <text x="504" y="116" fill="#8b93a7" font-size="11" text-anchor="middle">cheapest that plays</text>

  <!-- browser -->
  <rect x="632" y="70" width="160" height="62" rx="10" fill="#171b24" stroke="#21d07a"/>
  <text x="712" y="97" fill="#21d07a" font-size="13" font-weight="600" text-anchor="middle">&lt;video&gt;</text>
  <text x="712" y="116" fill="#8b93a7" font-size="11" text-anchor="middle">HTTP, Range-ready</text>

  <line x1="178" y1="101" x2="212" y2="101" stroke="#4f8cff" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="376" y1="101" x2="410" y2="101" stroke="#4f8cff" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="594" y1="101" x2="628" y2="101" stroke="#21d07a" stroke-width="1.6" marker-end="url(#g)"/>

  <!-- transports -->
  <rect x="414" y="176" width="180" height="96" rx="10" fill="#13161d" stroke="#232937"/>
  <text x="504" y="198" fill="#8b93a7" font-size="11" text-anchor="middle">three paths, tried in order</text>
  <text x="430" y="222" fill="#e8ecf4" font-size="12">1 · direct      raw bytes, 0 CPU</text>
  <text x="430" y="242" fill="#e8ecf4" font-size="12">2 · remux       container swap</text>
  <text x="430" y="262" fill="#e8ecf4" font-size="12">3 · transcode   only unsafe streams</text>
  <line x1="504" y1="176" x2="504" y2="136" stroke="#232937" stroke-width="1.6" stroke-dasharray="3 3"/>

  <!-- swarm -->
  <rect x="28" y="176" width="330" height="96" rx="10" fill="#13161d" stroke="#232937"/>
  <text x="48" y="200" fill="#e8ecf4" font-size="13" font-weight="600">Swarm (server-side WebTorrent)</text>
  <text x="48" y="224" fill="#8b93a7" font-size="11.5">pieces are pulled in 32 MB windows that follow the play head;</text>
  <text x="48" y="242" fill="#8b93a7" font-size="11.5">pieces at the read head are marked critical, so second 0 arrives first.</text>
  <text x="48" y="262" fill="#21d07a" font-size="11.5">8.8 MB watched out of a 42 MB torrent → 8.85 MB on disk.</text>

  <!-- storage -->
  <rect x="632" y="176" width="260" height="96" rx="10" fill="#13161d" stroke="#232937"/>
  <text x="652" y="200" fill="#e8ecf4" font-size="13" font-weight="600">data/ (the only writable place)</text>
  <text x="652" y="224" fill="#8b93a7" font-size="11.5">&lt;hash&gt;.torrent → offline replay, no peers</text>
  <text x="652" y="242" fill="#8b93a7" font-size="11.5">watched pieces → kept, evicted oldest-first</text>
  <text x="652" y="260" fill="#ffb020" font-size="11.5">8 GB ceiling · TMPDIR redirected here</text>
</svg>
